<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motos</title>

  <!-- CSS global -->
  <link rel="stylesheet" href="css/base/reset.css">
  <link rel="stylesheet" href="css/base/variables.css">
  <link rel="stylesheet" href="css/style.css">

  <!-- CSS da página -->
  <link rel="stylesheet" href="css/pages/motos.css">
</head>
<body>

  <header>
    <h1>🏍️ Catálogo de Motos</h1>
  </header>
  
  <nav class="nav-buttons">

  <button onclick="history.back()" class="btn-back">🔙 Voltar</button>
</nav>

  <main class="motos-container">

    <!-- CARD -->
    <div class="moto-card">
      <img src="assets/icons/yamaha.png" alt="Yamaha">
      <h2>Yamaha</h2>
      <p>Desempenho e tecnologia japonesa.</p>
      <button>Ver mais</button>
    </div>

    <div class="moto-card">
      <img src="assets/icons/honda-cbr.jpg" alt="Honda CBR">
      <h2>Honda CBR</h2>
      <p>Esportiva confiável e potente.</p>
      <button>Ver mais</button>
    </div>

    <div class="moto-card">
      <img src="assets/icons/harley.png" alt="Harley-Davidson">
      <h2>Harley-Davidson</h2>
      <p>Estilo clássico e robusto.</p>
      <button>Ver mais</button>
    </div>

    <div class="moto-card">
      <img src="assets/icons/kawasaki.png" alt="Kawasaki Ninja">
      <h2>Kawasaki Ninja</h2>

      <button>Ver mais</button>
    </div>
