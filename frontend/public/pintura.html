<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pintura Automotiva</title>

  <!-- CSS global -->
  <link rel="stylesheet" href="css/base/reset.css">
  <link rel="stylesheet" href="css/base/variables.css">
  <link rel="stylesheet" href="css/style.css">

  <!-- CSS da página -->
  <link rel="stylesheet" href="css/pages/pintura.css">
</head>
<body>

  <header>
    <h1>🎨 Serviços de Pintura</h1>
  </header>

  <nav class="nav-buttons">
  <a href="index.html" class="btn-home">🏠 Home</a>
  <button onclick="history.back()" class="btn-back">🔙 Voltar</button>
</nav>

  <main class="pintura-container">

    <div class="pintura-card">
      <img src="assets/icons/pintura-completa.png" alt="Pintura Completa">
      <h2>Pintura Completa</h2>
      <p>Renove totalmente a cor do seu veículo.</p>
      <button>Ver mais</button>
    </div>

    <div class="pintura-card">
      <img src="assets/icons/polimento.png" alt="Polimento">
      <h2>Polimento</h2>
      <p>Remoção de riscos e brilho intenso.</p>
      <button>Ver mais</button>
    </div>

    <div class="pintura-card">
      <img src="assets/icons/envelopamento.png" alt="Envelopamento">
      <h2>Envelopamento</h2>
      <p>Mude o visual sem pintura permanente.</p>
      <button>Ver mais</button>
    </div>

    <div class="pintura-card">
      <img src="assets/icons/retoco.png" alt="Retoque">
      <h2>Retoque</h2>
      <p>Correção de pequenos danos na pintura.</p>
      <button>Ver mais</button>
    </div>

  </main>

  <!-- MODAL -->
  <div id="pinturaModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <img id="modalImg" src="" alt="">
      <h2 id="modalTitle"></h2>
      <p id="modalDesc"></p>
    </div>
  </div>

  <script src="pintura.js"></script>

</body>
</html>
