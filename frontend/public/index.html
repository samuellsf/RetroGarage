<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetroGarage | Classic Cars</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages/index.css">
  <link rel="stylesheet" href="css/pages/home.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<header class="main-header">
  <div class="logo">
    <h1>Retro<span>Garage</span></h1>
  </div>
  
  <div class="search-bar">
    <input type="text" placeholder="Search">
    <i class="fas fa-search"></i>
  </div>

  <nav id="nav-menu">
    <div class="nav-icons">
      <a href="carrinho.html"><i class="fas fa-shopping-cart"></i></a>
      <a href="login.html"><i class="far fa-user-circle"></i></a>
      <div class="menu-hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </nav>
</header>

<main class="home">
    <section class="hero-banner">
      <div class="hero-bg"></div>
      <div class="hero-overlay"></div>

      <div class="hero-container">
        <div class="hero-content">
          <!-- <span class="hero-tag">Coleção</span> -->
          <h1>RetroGarage</h1>
          <p>
            Clássicos, restauração premium e peças selecionadas para apaixonados por máquinas atemporais.
          </p>

          <!-- <div class="hero-actions">
            <a href="./carros.html" class="btn btn-primary">Explorar Carros</a>
            <a href="./pecas.html" class="btn btn-secondary">Ver Peças</a>
          </div> -->
        </div>

        <aside class="hero-showcase" aria-label="Destaques da coleção">
          <div class="showcase-header">
            <span>Destaques</span>
            <div class="showcase-indicators">
              <button class="indicator active" type="button" data-slide="0" aria-label="Mostrar carro 1"></button>
              <button class="indicator" type="button" data-slide="1" aria-label="Mostrar carro 2"></button>
              <button class="indicator" type="button" data-slide="2" aria-label="Mostrar carro 3"></button>
            </div>
          </div>

          <div class="showcase-stage">
            <img src="assets/icons/carro1.png" alt="Porsche clássico azul" class="showcase-image active">
            <img src="assets/icons/Mercedes.png" alt="Mercedes clássica" class="showcase-image">
            <img src="assets/icons/mercedez.png" alt="Carro clássico branco" class="showcase-image">
          </div>

          <div class="showcase-info">
            <h3 id="showcase-title">Porsche 911</h3>
            <p id="showcase-text">Linhas atemporais, presença esportiva e uma das silhuetas mais reconhecíveis da história automotiva.</p>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <script type="module" src="js/modules/services/app.js"></script>
  <script type="module" src="js/modules/services/heroCarousel.js"></script>
</body>
</html>
