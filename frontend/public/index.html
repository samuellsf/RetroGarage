<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetroGarage | Classic Cars</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages/index.css">
  <link rel="stylesheet" href="css/pages/home.css">
  <link rel="stylesheet" href="css/pages/vrum.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

<header class="main-header">
  <div class="logo">
    <h1>Retro<span>Garage</span></h1>
  </div>

  <div class="search-bar">
    <input type="text" placeholder="Search">
    <i class="fas fa-search"></i>
  </div>

  <div class="header-actions">
    <div class="nav-icons">
      <a href="carrinho.html" class="cart-icon">
        <i class="fas fa-shopping-cart"></i>
        <span id="cart-count">0</span>
      </a>
      <a href="login.html"><i class="far fa-user-circle"></i></a>
    </div>

    <div class="menu-toggle" id="menuBtn">
      <i class="fas fa-bars"></i>
    </div>
  </div>

  <nav id="nav-menu" class="nav-menu">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="carros.html">Carros</a></li>
      <li><a href="motos.html">Motos</a></li>
      <li><a href="pecas.html">Peças</a></li>
      <li><a href="pintura.html">Pintura</a></li>
    </ul>
  </nav>
</header>

<main class="home">

  <section class="hero-banner">
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>

    <div class="hero-container">
      <div class="hero-content">
        <h1>RetroGarage</h1>
        <p>
          Clássicos, restauração premium e peças selecionadas para apaixonados por máquinas atemporais.
        </p>
      </div>

      <aside class="hero-showcase">
        <div class="showcase-header">
          <span>Destaques</span>
          <div class="showcase-indicators"></div>
        </div>

        <div class="showcase-stage">
          <button class="showcase-arrow left">&#10094;</button>
          <button class="showcase-arrow right">&#10095;</button>
        </div>

        <div class="showcase-info">
          <h3 id="showcase-title">Porsche 911</h3>
          <p id="showcase-text">
            Linhas atemporais e design icônico.
          </p>
        </div>
      </aside>
    </div>
  </section>

</main>

<script type="module" src="js/modules/services/app.js"></script>
<script type="module" src="js/modules/services/heroCarousel.js"></script>

</body>
</html>
