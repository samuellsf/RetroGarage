<div id="login-modal" class="modal">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2>FAÇA LOGIN RETROGARAGE</h2>
        
        <form id="login-form">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="********" required>
            </div>
            
            <div class="options">
                <label>
                    <input type="checkbox" id="remember"> Relembrar senha
                </label>
                <a href="#" class="forgot-password">Esqueci minha senha</a>
            </div>
            
            <button type="submit" class="btn-login">LOGIN</button>
            
            <div class="footer-links">
                <p>Não tem conta? <a href="#" id="go-to-register">Registrar</a></p>
                <p><a href="#" id="already-logged">Já tenho login</a></p>
            </div>
        </form>
    </div>
</div>
<script src="frontend/public/js/modules/services/login.js"></script>
